services:
  app:
    build: .
    # Remove port mapping - tunnel handles exposure
    volumes:
      - ./books.db:/app/books.db
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
    networks:
      - keeply-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://app:8000
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - keeply-network

networks:
  keeply-network:
    driver: bridge
