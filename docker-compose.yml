# This was setup by Copilot 
# At this point i just wanted to get the container working

services:
  app:
    build: .
    # Remove port mapping - tunnel handles exposure
    volumes:
      - ./books.db:/app/books.db
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
    networks:
      - keeply-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run bitwerk-tunnel
    volumes:
      - /home/pnsngltn/.cloudflared:/etc/cloudflared:ro
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - keeply-network

networks:
  keeply-network:
    driver: bridge
