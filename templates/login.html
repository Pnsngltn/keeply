{% extends "layout.html" %}

{% block title %}
Login
{% endblock %}

{% block main %}
<div class="px-4 py-5 my-5 text-center">
    <form action="/login" method="post">
	<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
	<div class="mb-3">
	    <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="username" placeholder="Username" type="text" required>
	</div>
	<div class="mb-3">
	    <input autocomplete="off" class="form-control mx-auto w-auto" name="password" placeholder="Password" type="password" required>
	</div>
	<button class="btn btn-primary d-block mx-auto" type="submit">Login</button>
    </form>
    {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
</div> 
{% endblock %}
